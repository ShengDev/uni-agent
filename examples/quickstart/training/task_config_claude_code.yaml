- name: swe_bench
  sandbox:
    provider: vefaas
    runtime_timeout: 7200
    image_map:
      - from: "swebench/**:latest"
        to: "enterprise-public-cn-beijing.cr.volces.com/swe-bench-verified/**:v2"
      - from: "swerebench/**:latest"
        to: "enterprise-public-cn-beijing.cr.volces.com/swe-rebench/**:latest"
  agent:
    name: claude_code
    max_turns: 200
    run_timeout: 4800
    model:
      temperature: 1.0
      top_p: 1.0
      max_total_tokens: 131072

- name: swe_rebench
  sandbox:
    provider: vefaas
    runtime_timeout: 7200
    image_map:
      - from: "swebench/**:latest"
        to: "enterprise-public-cn-beijing.cr.volces.com/swe-bench-verified/**:v2"
      - from: "swerebench/**:latest"
        to: "enterprise-public-cn-beijing.cr.volces.com/swe-rebench/**:latest"
  agent:
    name: claude_code
    max_turns: 200
    run_timeout: 4800
    model:
      temperature: 1.0
      top_p: 1.0
      max_total_tokens: 131072
